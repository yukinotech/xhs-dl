name: CLI verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@12.21.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm docs:check
      - run: pnpm pack --pack-destination package-check
      - run: node dist/cli.js doctor --format json
        env:
          XHS_DL_STATE_DIR: ${{ runner.temp }}/xhs-dl-state
          XHS_DL_CONFIG_DIR: ${{ runner.temp }}/xhs-dl-config
